name: simple-elastic-logs

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.4.4}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      bootstrap.memory_lock: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u \"elastic:$${ELASTIC_PASSWORD}\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.4.4}
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?Set KIBANA_PASSWORD in .env}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?Set LOGSTASH_PASSWORD in .env}
    command:
      - bash
      - -c
      - |
        set -euo pipefail

        for value in "$${ELASTIC_PASSWORD}" "$${KIBANA_PASSWORD}" "$${LOGSTASH_PASSWORD}"; do
          if [[ ! "$${value}" =~ ^[[:alnum:]]{8,}$$ ]]; then
            echo "Passwords must contain only letters and numbers and be at least 8 characters long." >&2
            exit 1
          fi
        done

        auth=(-u "elastic:$${ELASTIC_PASSWORD}")
        json=(-H "Content-Type: application/json")
        endpoint="http://elasticsearch:9200"

        echo "Initializing Elastic users and roles..."

        curl -fsS "$${auth[@]}" "$${json[@]}" \
          -X POST "$${endpoint}/_security/user/elastic/_password" \
          -d "{\"password\":\"$${ELASTIC_PASSWORD}\"}" >/dev/null

        curl -fsS "$${auth[@]}" "$${json[@]}" \
          -X POST "$${endpoint}/_security/user/kibana_system/_password" \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" >/dev/null

        curl -fsS "$${auth[@]}" "$${json[@]}" \
          -X PUT "$${endpoint}/_security/role/logstash_writer" \
          -d '{"cluster":["monitor"],"indices":[{"names":["vm-logs-*"],"privileges":["write","create","create_index","view_index_metadata"]}]}' >/dev/null

        curl -fsS "$${auth[@]}" "$${json[@]}" \
          -X POST "$${endpoint}/_security/user/logstash_internal" \
          -d "{\"password\":\"$${LOGSTASH_PASSWORD}\",\"roles\":[\"logstash_writer\"],\"full_name\":\"Internal Logstash User\"}" >/dev/null

        echo "Elastic security initialization complete."
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.4.4}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?Set KIBANA_PASSWORD in .env}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY:?Set KIBANA_SECURITY_ENCRYPTION_KEY in .env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY:?Set KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY in .env}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY:?Set KIBANA_REPORTING_ENCRYPTION_KEY in .env}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-9.4.4}
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms256m -Xmx256m}
      xpack.monitoring.enabled: "false"
      LOGSTASH_USERNAME: logstash_internal
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?Set LOGSTASH_PASSWORD in .env}
    ports:
      - "${LOGSTASH_BIND_ADDRESS:-0.0.0.0}:${LOGSTASH_BEATS_PORT:-5044}:5044"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  elasticsearch-data:
